name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-ready:
    name: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Rust build and existing simulation tests
        run: cargo test --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install visualization dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile
      - name: Build existing visualization
        working-directory: visualization
        run: bun run build
